name: Go

on:
  push:
    branches: [main, go-port]
  pull_request:
    branches: [main, go-port]

jobs:
  check:
    # ubuntu-latest has /dev/ptmx, so it's tty-capable: the PTY screen
    # driver (internal/testkit/screen, cmd/kiln-drive) and its tests work
    # fine here without a self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: make check
        run: make check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: make e2e
        run: make e2e

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: make race
        run: make race

  cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: make covercheck
        run: make covercheck

      - name: upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage.out
          path: coverage.out

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: make eval
        run: make eval

      - name: upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/*.jsonl

  # cross-compile: every GOOS/GOARCH release.yml builds for, plus `go vet`
  # for windows. This cannot run or vet-check darwin/linux themselves (the
  # main `check`/`race` jobs above already do, natively, on ubuntu-latest's
  # linux/amd64); it exists to catch a GOOS-specific compile break (like
  # the one fixed alongside this job: syscall.Kill/Setpgid are Unix-only)
  # before it reaches a release build. go vet actually runs the analyzers,
  # which `go build` does not, so windows (the one GOOS this repo cannot
  # test on any runner here) gets that extra check; the others get build
  # only, since their analyzers run natively in the check/race jobs.
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath ./...

      - name: go vet (windows)
        if: matrix.goos == 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go vet -tags e2e ./test/e2e/...
