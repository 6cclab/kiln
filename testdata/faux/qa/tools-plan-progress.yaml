# todo_write called four times across one turn so the live plan block
# advances its current-item marker (▸) and checks off items (✓), mirroring
# testdata/faux/plan-live.yaml but carried through to full completion.
# Each later call is held (plan-2, plan-3, plan-4) until the scenario has
# captured the state before it and says RELEASE, so every state stays on
# screen for as long as the driver needs.
model: faux-1
steps:
  - tool_call:
      name: todo_write
      args:
        todos:
          - {content: "read the upload handler", status: in_progress}
          - {content: "add the rate limiter", status: pending}
          - {content: "wire it into the route", status: pending}
      id: tc1
  - on_tool_result: tc1
    then:
      - hold: plan-2
      - tool_call:
          name: todo_write
          args:
            todos:
              - {content: "read the upload handler", status: completed}
              - {content: "add the rate limiter", status: in_progress}
              - {content: "wire it into the route", status: pending}
          id: tc2
  - on_tool_result: tc2
    then:
      - hold: plan-3
      - tool_call:
          name: todo_write
          args:
            todos:
              - {content: "read the upload handler", status: completed}
              - {content: "add the rate limiter", status: completed}
              - {content: "wire it into the route", status: in_progress}
          id: tc3
  - on_tool_result: tc3
    then:
      - hold: plan-4
      - tool_call:
          name: todo_write
          args:
            todos:
              - {content: "read the upload handler", status: completed}
              - {content: "add the rate limiter", status: completed}
              - {content: "wire it into the route", status: completed}
          id: tc4
  - on_tool_result: tc4
    then:
      - text: "Plan advanced through all three steps."
        delay: 400ms
        usage: {input: 150, output: 15}
