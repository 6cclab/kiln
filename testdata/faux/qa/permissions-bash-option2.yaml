# Option 2 ("don't ask again for: npm test *") on a compound line: it saves
# one rule per command needing approval (the read-only git log needs
# none), so a later npm test with other arguments runs without a prompt.
model: faux-1
steps:
  - tool_call: {name: bash, args: {command: "git log -1 && npm test -- upload"}, id: tc1}
  - on_tool_result: tc1
    then:
      - tool_call: {name: bash, args: {command: "npm test -- download"}, id: tc2}
  - on_tool_result: tc2
    then:
      - text: "Both test runs done, second one didn't need approval."
        usage: {input: 200, output: 20}
