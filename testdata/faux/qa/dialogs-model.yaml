model: faux-1
steps:
  # end_turn: true splits the two typed turns into two separate replies;
  # see dialogs-agents.yaml for why this matters (without it "second task
  # please" silently hits "faux: script exhausted").
  - text: "Sure, first task done."
    usage: {input: 20, output: 10}
    end_turn: true
  - text: "Second task done as well."
    usage: {input: 25, output: 12}
