# Two concurrent `task` dispatches, same shape as
# testdata/faux/task_concurrent_tui.yaml (used by
# test/e2e/tui_gap_test.go's TestTUI_ResizeDuringLiveSubagentRow). Both
# subagents' replies are held until the scenario has resized (RELEASE
# subagents), so the "2 subagents running" state lasts as long as the
# driver needs, however slow its screen polls are.
models:
  faux-1:
    - tool_calls:
        - {name: task, args: {subagent_type: "general-purpose", description: "look something up", prompt: "find X"}, id: tc1}
        - {name: task, args: {subagent_type: "general-purpose", description: "do the fast lookup", prompt: "find Y", model: "fast"}, id: tc2}
    - hold: subagents
    - text: "inherited subagent report"
    - on_tool_results: [tc1, tc2]
      then:
        - text: "Both done."
  faux-2:
    - hold: subagents
    - text: "fast subagent report"
