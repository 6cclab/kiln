models:
  faux-1:
    - tool_call:
        name: task
        args:
          subagent_type: "general-purpose"
          description: "quick lookup"
          prompt: "In one sentence, what does this project do?"
          model: "fast"
        id: tc1
    - on_tool_result: tc1
      then:
        - text: "The fast subagent reported back: this is a fixture project for testing subagent dispatch."
          usage: {input: 200, output: 30}
  faux-2:
    - text: "This is a fixture project for testing subagent dispatch."
