model: faux-1
steps:
  - text: "I'll read clamp.go before refactoring."
  - tool_call: {name: read, args: {path: clamp.go}, id: tc1}
  - on_tool_result: tc1
    then:
      - tool_call:
          name: edit
          args:
            path: clamp.go
            edits:
              - oldText: |
                  func ClampLow(x int) int {
                  	if x < 0 {
                  		return 0
                  	}
                  	return x
                  }

                  func ClampHigh(x, max int) int {
                  	if x > max {
                  		return max
                  	}
                  	return x
                  }
                newText: |
                  func Clamp(x, lo, hi int) int {
                  	if x < lo {
                  		return lo
                  	}
                  	if x > hi {
                  		return hi
                  	}
                  	return x
                  }

                  func ClampLow(x int) int {
                  	return Clamp(x, 0, x)
                  }

                  func ClampHigh(x, max int) int {
                  	return Clamp(x, x, max)
                  }
          id: tc2
  - on_tool_result: tc2
    then:
      - tool_call: {name: bash, args: {command: "go test ./..."}, id: tc3}
  - on_tool_result: tc3
    then:
      - text: "Extracted the shared bounds check into Clamp(); ClampLow and ClampHigh now call it, and tests still pass."
        usage: {input: 950, output: 70}
